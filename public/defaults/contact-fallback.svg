  </defs>
  <rect width="100%" height="100%" fill="url(#contactGrad)"/>
  <rect width="100%" height="100%" fill="url(#dots)"/>
  <!-- Envelope icon suggestion -->
  <g transform="translate(580, 300)" opacity="0.1">
    <rect x="0" y="20" width="120" height="80" rx="5" fill="white"/>
    <path d="M0,25 L60,65 L120,25" fill="none" stroke="white" stroke-width="3"/>
